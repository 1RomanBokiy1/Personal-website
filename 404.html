<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bokiy Corp</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/404.css">
</head>
<body>

<div id="preloader" class="preloader>
    <div class="preloader-logo">BOKIY CORP</div>
    <div class="preloader-spinner"></div>
</div>

<script>
    (function() {
        const preloader = document.getElementById('preloader');
        if (preloader) {
            requestAnimationFrame(() => {
                preloader.classList.add('active');
                setTimeout(() => {
                    preloader.classList.remove('active');
                }, 1000);
            });
        }
    })();
</script>

<div id="header-placeholder"></div>

<section class="error-page">
    <div class="container error-container">
        <h1 class="mega-text error-bg-text">404</h1>
        <div class="error-box fade-in">
            <h2>404 NOT FOUND</h2>
        </div>
        <p class="error-description">Похоже, эта страница была удалена или никогда не существовала. Попробуйте вернуться на главную.</p>
        <a href="index.html" class="btn">Главная</a>
    </div>
</section>

<div id="footer-placeholder"></div>

<script src="scripts/script1.js"></script>
<script src="scripts/loadComponents.js"></script>
</body>
</html>
